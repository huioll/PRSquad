[project]
name = "prsquad"
version = "0.1.0"
description = "Multi-agent AI code reviewer for GitHub PRs (LangGraph + FastAPI)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "langgraph>=0.2.30",
  "langchain-core>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]
openai = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prsquad"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
