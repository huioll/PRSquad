services:
  prsquad:
    build: .
    ports:
      - "8001:8001"
    environment:
      PRSQUAD_LLM_PROVIDER: ${PRSQUAD_LLM_PROVIDER:-stub}
      PRSQUAD_OPENAI_API_KEY: ${PRSQUAD_OPENAI_API_KEY:-}
      PRSQUAD_GITHUB_TOKEN: ${PRSQUAD_GITHUB_TOKEN:-}
      PRSQUAD_POST_COMMENTS: ${PRSQUAD_POST_COMMENTS:-false}
      PRSQUAD_WEBHOOK_SECRET: ${PRSQUAD_WEBHOOK_SECRET:-}
